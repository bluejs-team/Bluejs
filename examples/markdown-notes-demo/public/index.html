<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blue - Markdown Notes</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1220;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #1e293b;
    }
    header h1 {
      font-size: 1.15rem;
      color: #7dd3fc;
      font-weight: 600;
    }
    .status {
      margin-left: auto;
      font-size: 0.85rem;
      color: #64748b;
      transition: color 0.3s;
    }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
    .editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.25rem;
      gap: 0.75rem;
    }
    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border-radius: 10px;
      border: 1px solid #1e293b;
      background: #111827;
      color: #e2e8f0;
      padding: 0.85rem 1rem;
      font-family: 'SF Mono', 'Fira Code', monospace, system-ui;
      font-size: 0.95rem;
      line-height: 1.6;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #38bdf8; }
    .bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1.1rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:active { transform: scale(0.97); }
    .save-btn { background: #0ea5e9; color: #0f172a; }
    .save-btn:hover { background: #38bdf8; }
    .load-btn { background: #334155; color: #e2e8f0; }
    .load-btn:hover { background: #475569; }
    .meta {
      margin-left: auto;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <header>
    <h1>Markdown Notes</h1>
    <span id="status" class="status">Ready</span>
  </header>

  <div class="editor">
    <textarea id="editor" placeholder="Write markdown here…">
# Notes

Edit me - saves to **./text.md** via the native bridge.
    </textarea>
    <div class="bar">
      <button class="save-btn" onclick="save()">Save</button>
      <button class="load-btn" onclick="load()">Load</button>
      <span class="meta" id="meta"></span>
    </div>
  </div>

  <script>
    var editor = document.getElementById("editor");
    var statusEl = document.getElementById("status");
    var metaEl = document.getElementById("meta");

    function updateMeta() {
      metaEl.textContent = new Blob([editor.value]).size + " bytes";
    }

    function setStatus(msg, ok) {
      statusEl.textContent = msg;
      statusEl.className = "status " + (ok ? "ok" : ok === false ? "err" : "");
    }

    function save() {
      setStatus("Saving…");
      fetch("blue://app/__bridge__/saveNote/" + encodeURIComponent(editor.value))
        .then(function(r) { return r.text(); })
        .then(function(t) {
          if (t.trim() === "saved") {
            setStatus("Saved", true);
          } else {
            setStatus("Save failed", false);
          }
        })
        .catch(function() { setStatus("Save error", false); });
    }

    function load() {
      setStatus("Loading…");
      fetch("blue://app/__bridge__/loadNote/")
        .then(function(r) { return r.text(); })
        .then(function(t) {
          if (t) {
            editor.value = t;
            updateMeta();
            setStatus("Loaded", true);
          } else {
            setStatus("No saved note found", false);
          }
        })
        .catch(function() { setStatus("Load error", false); });
    }

    editor.addEventListener("input", function() { updateMeta(); });
    updateMeta();

    // Auto-load on start
    load();
  </script>
</body>
</html>
